<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <script>
        let rates = { TWD: 1, JPY: 0.22 };
        let members = [];

        function updateCurrencyOptions() {
            const currencySelect = document.getElementById('currencySelect');
            currencySelect.innerHTML = '<option value="JPY">JPY</option>';
        }

        function handleCurrencyChange() {
            const selectedCurrency = document.getElementById('currencySelect').value;
            if (selectedCurrency === 'JPY') {
                // Fetch rate for JPY from server
                fetch('action=rate&currency=JPY')
                    .then(response => response.json())
                    .then(data => {
                        const rate = data.rate;
                        document.getElementById('rateDisplay').innerText = `匯率：1 JPY ≈ ${rate} TWD`;
                    });
            }
        }

        function calculateSummary() {
            // Implement summary calculation based on JPY
        }

        function renderMembers() {
            // Handle rendering of member list, allowing for empty list
            const memberList = document.getElementById('memberList');
            memberList.innerHTML = '';
            members.forEach(member => {
                const li = document.createElement('li');
                li.textContent = member;
                memberList.appendChild(li);
            });
        }

        window.onload = function() {
            updateCurrencyOptions();
        };
    </script>
</head>
<body>
    <h1>Currency Converter</h1>
    <select id="currencySelect" onchange="handleCurrencyChange()"></select>
    <div id="rateDisplay"></div>
    <ul id="memberList"></ul>
</body>
</html>
